name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbup:
    name: DbUp Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database/dbup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build AdventureWorks.DbUp.sln --configuration Release

  api:
    name: .NET API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: apps/api-dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/api-dotnet/**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore AdventureWorks.sln

      - name: Build
        run: dotnet build AdventureWorks.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/AdventureWorks.UnitTests/AdventureWorks.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
        env:
          AutoMapperLicenseKey: ${{ secrets.AUTOMAPPER_LICENSE_KEY }}

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: API Test Results
          path: apps/api-dotnet/**/test-results.trx
          reporter: dotnet-trx

  functions:
    name: Sales Order Saga Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/functions-dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-functions-${{ hashFiles('apps/functions-dotnet/**/*.csproj', 'apps/api-dotnet/src/AdventureWorks.Domain/**/*.cs', 'apps/api-dotnet/src/AdventureWorks.Application/**/*.cs') }}
          restore-keys: nuget-functions-

      - name: Pack local NuGet feed (AdventureWorks.Domain/Application)
        run: ./pack-local-nuget.sh

      - name: Restore
        run: dotnet restore AdventureWorks.Functions.sln

      - name: Build
        run: dotnet build AdventureWorks.Functions.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/AdventureWorks.SalesOrderSaga.UnitTests/AdventureWorks.SalesOrderSaga.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Test saga harness
        run: dotnet test tests/AdventureWorks.SalesOrderSaga.TestHarness.Tests/AdventureWorks.SalesOrderSaga.TestHarness.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Functions Test Results
          path: |
            apps/functions-dotnet/**/test-results.trx
            apps/functions-dotnet/tests/AdventureWorks.SalesOrderSaga.TestHarness.Tests/**/test-results.trx
          reporter: dotnet-trx

  functions-rust:
    name: Bill Of Materials (BOM) Cost Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/functions-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-${{ hashFiles('apps/functions-rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release
        run: cargo build --locked --release

  angular:
    name: Angular Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/angular-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/angular-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/angular-web/.nx/cache
          key: nx-${{ hashFiles('apps/angular-web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ hashFiles('apps/angular-web/package-lock.json') }}-
            nx-

      - name: Lint
        run: npx nx lint adventureworks-web

      - name: Format check
        run: npx prettier --check "apps/**/*.ts" "libs/**/*.ts"

      - name: Build
        run: npx nx build adventureworks-web --configuration=production

      - name: Test
        run: npx nx test adventureworks-web
