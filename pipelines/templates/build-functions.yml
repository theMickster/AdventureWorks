# Build Azure Functions app: pack local NuGet deps, restore, build, test, publish artifact.
# Called as a job template from the main pipeline.

parameters:
  - name: solution
    type: string
    default: "apps/functions-dotnet/AdventureWorks.Functions.sln"
  - name: project
    type: string
    default: "apps/functions-dotnet/src/AdventureWorks.SalesOrderSaga/AdventureWorks.SalesOrderSaga.csproj"
  - name: testProject
    type: string
    default: "apps/functions-dotnet/tests/AdventureWorks.SalesOrderSaga.UnitTests/AdventureWorks.SalesOrderSaga.UnitTests.csproj"
  - name: orchestrationTestProject
    type: string
    default: "apps/functions-dotnet/tests/AdventureWorks.SalesOrderSaga.OrchestrationTests/AdventureWorks.SalesOrderSaga.OrchestrationTests.csproj"
  - name: harnessTestProject
    type: string
    default: "apps/functions-dotnet/tests/AdventureWorks.SalesOrderSaga.TestHarness.Tests/AdventureWorks.SalesOrderSaga.TestHarness.Tests.csproj"
  - name: buildConfiguration
    type: string
    default: "Release"
  - name: dotNetSdkVersion
    type: string
    default: "10.0.x"
  - name: artifactName
    type: string
    default: "functions-artifact"

steps:
  - task: UseDotNet@2
    displayName: "Install .NET SDK ${{ parameters.dotNetSdkVersion }}"
    inputs:
      packageType: sdk
      version: "${{ parameters.dotNetSdkVersion }}"

  - task: Cache@2
    displayName: "Cache NuGet packages"
    inputs:
      key: 'nuget | "$(Agent.OS)" | apps/functions-dotnet/**/*.csproj | apps/api-dotnet/src/AdventureWorks.Domain/*.csproj | apps/api-dotnet/src/AdventureWorks.Application/*.csproj'
      restoreKeys: 'nuget | "$(Agent.OS)"'
      path: "$(HOME)/.nuget/packages"

  - script: ./pack-local-nuget.sh
    displayName: "Pack local NuGet feed (Domain/Application)"
    workingDirectory: apps/functions-dotnet

  - script: dotnet restore "${{ parameters.solution }}" --verbosity $(dotnetVerbosity)
    displayName: "Restore NuGet packages"

  - task: DotNetCoreCLI@2
    displayName: "Build solution"
    inputs:
      command: build
      projects: "${{ parameters.solution }}"
      arguments: "--configuration ${{ parameters.buildConfiguration }} --no-restore --verbosity $(dotnetVerbosity)"

  - template: run-dotnet-test.yml
    parameters:
      testProject: "${{ parameters.testProject }}"
      testRunTitle: "AdventureWorks.Functions UnitTests"
      resultsDirectory: "functions-unit"
      buildConfiguration: "${{ parameters.buildConfiguration }}"
      testOptions: "--no-build"

  - template: run-dotnet-test.yml
    parameters:
      testProject: "${{ parameters.orchestrationTestProject }}"
      testRunTitle: "AdventureWorks.Functions OrchestrationTests"
      resultsDirectory: "functions-orchestration"
      buildConfiguration: "${{ parameters.buildConfiguration }}"
      testOptions: "--no-build"
      continueOnError: true

  - template: run-dotnet-test.yml
    parameters:
      testProject: "${{ parameters.harnessTestProject }}"
      testRunTitle: "AdventureWorks.SagaTestHarness"
      resultsDirectory: "functions-harness"
      buildConfiguration: "${{ parameters.buildConfiguration }}"
      testOptions: "--no-build"

  - task: DotNetCoreCLI@2
    displayName: "Publish Functions app"
    inputs:
      command: publish
      publishWebProjects: false
      projects: "${{ parameters.project }}"
      arguments: "--configuration ${{ parameters.buildConfiguration }} --output $(Build.ArtifactStagingDirectory)/functions --verbosity $(dotnetVerbosity)"

  - task: ArchiveFiles@2
    displayName: "Zip Functions output"
    inputs:
      rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/functions"
      includeRootFolder: false
      archiveType: zip
      archiveFile: "$(Build.ArtifactStagingDirectory)/functions.zip"

  - template: publish-artifact.yml
    parameters:
      artifactName: "${{ parameters.artifactName }}"
      targetPath: "$(Build.ArtifactStagingDirectory)/functions.zip"
