<div id="aw-work-order-list-page">
  <div id="aw-work-order-list-header" class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-base-content">Work Orders</h1>
  </div>

  <form id="aw-work-order-list-filters" [formGroup]="filterForm" class="mb-4" (ngSubmit)="onApplyFilters()">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">
          <label for="aw-work-order-filter-product-id">Product ID</label>
        </legend>
        <input
          id="aw-work-order-filter-product-id"
          type="number"
          class="input input-bordered w-full"
          formControlName="productId"
        />
      </fieldset>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">
          <label for="aw-work-order-filter-scrap-reason-id">Scrap Reason ID</label>
        </legend>
        <input
          id="aw-work-order-filter-scrap-reason-id"
          type="number"
          class="input input-bordered w-full"
          formControlName="scrapReasonId"
        />
      </fieldset>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">
          <label for="aw-work-order-filter-start-date">Start Date</label>
        </legend>
        <input
          id="aw-work-order-filter-start-date"
          type="date"
          class="input input-bordered w-full"
          formControlName="startDate"
        />
      </fieldset>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">
          <label for="aw-work-order-filter-end-date">End Date</label>
        </legend>
        <input
          id="aw-work-order-filter-end-date"
          type="date"
          class="input input-bordered w-full"
          formControlName="endDate"
        />
      </fieldset>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">
          <label for="aw-work-order-filter-has-scrapped">Scrap Status</label>
        </legend>
        <select
          id="aw-work-order-filter-has-scrapped"
          class="select select-bordered w-full"
          formControlName="hasScrapped"
        >
          <option value="">All</option>
          <option value="true">With Scrap</option>
          <option value="false">No Scrap</option>
        </select>
      </fieldset>
    </div>

    <div class="mt-3 flex items-center gap-2">
      <button id="aw-work-order-filter-apply-btn" type="submit" class="btn btn-primary">
        <i class="fa-solid fa-filter" aria-hidden="true"></i>
        Apply
      </button>
      <button id="aw-work-order-filter-reset-btn" type="button" class="btn btn-ghost" (click)="onResetFilters()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        Reset Filters
      </button>
    </div>
  </form>

  <aw-data-table
    fieldId="aw-work-order-list-table"
    [columns]="columns"
    [data]="rows()"
    [loading]="isLoading()"
    [pageNumber]="pageNumber()"
    [pageSize]="pageSize()"
    [totalPages]="totalPages()"
    [totalRecords]="totalRecords()"
    [sortColumn]="sortColumn()"
    [sortDirection]="sortDirection()"
    emptyTitle="No work orders found"
    emptyDescription="Try adjusting your filters."
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
  >
    <ng-template awColumnDef="yieldRate" let-row> {{ $any(row)['yieldRate'] }}% </ng-template>
    <ng-template awColumnDef="statusKey" let-row>
      @if ($any(row)['statusKey']) {
        <aw-status-badge [status]="$any(row)['statusKey']" [statusMap]="statusBadgeMap" />
      }
    </ng-template>
    <ng-template awColumnDef="view" let-row>
      <button type="button" class="btn btn-ghost btn-xs" (click)="onViewClick(row)">View</button>
    </ng-template>
  </aw-data-table>
</div>
