<div id="aw-vendor-list-page">
  <div id="aw-vendor-list-header" class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-base-content">Vendors</h1>
  </div>

  <form id="aw-vendor-list-filters" [formGroup]="filterForm" class="mb-4" (ngSubmit)="onApplyFilters()">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <aw-select-field
        fieldId="aw-vendor-filter-credit-rating"
        formControlName="creditRating"
        label="Credit Rating"
        emptyOptionLabel="All ratings"
        [options]="creditRatingOptions"
      />

      <aw-toggle-field
        fieldId="aw-vendor-filter-preferred"
        formControlName="preferredVendorStatus"
        label="Preferred vendors only"
      />

      <aw-toggle-field fieldId="aw-vendor-filter-active" formControlName="activeFlag" label="Active vendors only" />
    </div>

    <div class="mt-3 flex items-center gap-2">
      <button id="aw-vendor-filter-apply-btn" type="submit" class="btn btn-primary">
        <i class="fa-solid fa-filter" aria-hidden="true"></i>
        Apply
      </button>
      <button id="aw-vendor-filter-reset-btn" type="button" class="btn btn-ghost" (click)="onResetFilters()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        Reset Filters
      </button>
    </div>
  </form>

  <aw-data-table
    fieldId="aw-vendor-list-table"
    [columns]="columns"
    [data]="rows()"
    [loading]="isLoading()"
    [pageNumber]="pageNumber()"
    [pageSize]="pageSize()"
    [totalPages]="totalPages()"
    [totalRecords]="totalRecords()"
    emptyTitle="No vendors found"
    emptyDescription="Try adjusting your filters."
    (pageChange)="onPageChange($event)"
  >
    <ng-template awColumnDef="status" let-row>
      <aw-status-badge [status]="$any(row)['statusKey']" [statusMap]="statusBadgeMap" />
    </ng-template>
    <ng-template awColumnDef="totalSpend" let-row>
      {{ $any(row)['totalSpend'] | currency }}
    </ng-template>
    <ng-template awColumnDef="risk" let-row>
      <aw-status-badge [status]="$any(row)['riskKey']" [statusMap]="riskBadgeMap" />
    </ng-template>
  </aw-data-table>
</div>
