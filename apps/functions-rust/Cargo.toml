[package]
name = "aw-bom-cost"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "BOM cost explosion and manufacturing feasibility engine (Azure Functions custom handler)."

[lib]
name = "aw_bom_cost"
path = "src/lib.rs"

[[bin]]
name = "handler"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bb8 = "0.9"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
rust_decimal = { version = "1", features = ["serde-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rust_decimal", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
azure_core = "1"
azure_data_cosmos = { version = "=1.0.0-beta.1", features = ["key_auth", "control_plane"] }
azure_identity = "1"
azure_security_keyvault_secrets = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
rust_decimal_macros = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
lapin = { version = "4.12", default-features = false, features = ["tokio"] }
